[package]
name = "yma-redis-pool"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Redis连接池封装，提供高频操作的统一异步接口"

[dependencies]
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"