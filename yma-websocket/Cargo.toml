[package]
name = "yma-websocket"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebSocket连接管理，支持心跳检测、广播消息、房间管理"

[dependencies]
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8.9", features = ["macros", "ws"] }
futures-util = "0.3"
dashmap = "6"
uuid = { version = "1.8.0", features = ["v4"] }
tracing = "0.1.41"
tokio-stream = "0.1"