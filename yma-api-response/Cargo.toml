[package]
name = "yma-api-response"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "统一API响应格式，提供ApiResponse/PaginatedApiResponse/PaginationInfo/ErrorCode"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4"] }
axum = { version = "0.8.9", features = ["macros"], optional = true }

[features]
default = []
web = ["axum"]