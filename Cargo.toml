[workspace]
resolver = "2"
members = [
    "yma-crypto",
    "yma-auth",
    "yma-sandbox",
    "yma-advertising",
    "yma-config",
    "yma-events",
    "yma-logging",
    "yma-storage",
    "yma-id",
    "yma-validation",
    "yma-data-masking",
    "yma-api-response",
    "yma-pagination",
    "yma-api-version",
    "yma-xss",
    "yma-sql-guard",
    "yma-security-headers",
    "yma-sensitive-filter",
    "yma-rate-limit",
    "yma-csrf",
    "yma-health",
    "yma-audit",
    "yma-redis-pool",
    "yma-email",
    "yma-upload",
    "yma-scheduler",
    "yma-websocket",
    "yma-migration",
    "yma-metrics",
    "yma-search-client",
    "yma-p2p",
    "yma-ssh",
    "yma-social",
    "yma-payment",
    "yma-llm",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "YMAIStation yma-common 公共基础库"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
hex = "0.4.3"
rand = "0.8.5"
base64 = "0.21"
once_cell = "1.19"
parking_lot = "0.12"
async-trait = "0.1"
bytes = "1.5"

# 国密算法 (jishuzhan.md 标准)
sm2 = { version = "0.14.0-rc.10", features = ["dsa", "pke", "arithmetic", "alloc"] }
sm3 = "0.5.0-rc.6"
sm4 = "0.6.0"
smcrypto = "0.3.1"
# 国密 sm2/sm3 已迁移至 digest 0.11，为保证兼容性 digest 维持 0.11
digest = "0.11"
ring = "0.17.14"

# Hash & HMAC
hmac = "0.13"
jsonwebtoken = "9.3"
bcrypt = "0.15.0"

# axum web framework
axum = { version = "0.8.9", features = ["macros"] }
tower = "0.5"

# CSRF
sha2 = "0.10"

# HTML/XSS sanitization
ammonia = "4.1"
html-escape = "0.2"

# Concurrency
dashmap = "6"

# Redis
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }

# Wasmtime sandbox
wasmtime = { version = "45.0.0", features = ["async"] }
wasmtime-wasi = "45.0.3"

# 基础设施层依赖
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "json", "migrate"] }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "rustls-tls"] }
prometheus = "0.13"
image = { version = "0.25.10", features = ["jpeg", "png", "gif", "webp"] }
meilisearch-sdk = "0.24"
tokio-cron-scheduler = "0.14"
futures-util = "0.3"
tokio-stream = "0.1"
mime = "0.3"

# 协议层依赖
libp2p = { version = "0.54", features = ["tokio", "noise", "yamux", "tcp", "dns", "identify", "ping", "request-response", "gossipsub", "kad", "mdns"] }
russh = { version = "0.48" }
russh-keys = "0.48"
anyhow = "1.0"

# 域公共层依赖
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"