[workspace]
resolver = "2"
members = [
    "yma-crypto",
    "yma-auth",
    "yma-sandbox",
    "yma-advertising",
    "yma-config",
    "yma-events",
    "yma-logging",
    "yma-storage",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"
description = "YMAIStation yma-common 公共基础库"

[workspace.dependencies]
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
hex = "0.4.3"
rand = "0.8.5"
base64 = "0.21"
once_cell = "1.19"
parking_lot = "0.12"
async-trait = "0.1"
bytes = "1.5"

# 国密算法 (jishuzhan.md 标准)
sm2 = { version = "0.14.0-rc.9", features = ["dsa", "pke", "arithmetic", "alloc"] }
sm3 = "0.5.0"
sm4 = "0.6.0"
smcrypto = "0.3"
digest = "0.10"
ring = "0.17.14"

# Hash & HMAC
hmac = "0.13"
jsonwebtoken = "9"
bcrypt = "0.15.0"

# Wasmtime sandbox
wasmtime = { version = "43.0.0", features = ["async"] }
wasmtime-wasi = "43.0.0"