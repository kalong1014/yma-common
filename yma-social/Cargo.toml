[package]
name = "yma-social"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "社交图谱抽象层，提供关注、取关、屏蔽、好友关系管理的基础接口"

[dependencies]
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4"] }
async-trait = "0.1"