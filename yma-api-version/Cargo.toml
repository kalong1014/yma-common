[package]
name = "yma-api-version"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "API版本管理，支持Active/Deprecated/Sunset版本生命周期管理"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"], optional = true }

[features]
default = []
axum-handler = ["axum"]